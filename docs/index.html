<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arkmap-js — demo viewer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #14171c; color: #dde3ea; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid #2a3038; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; padding-top: 5px; }
  header h1 span { color: #6f7684; font-weight: 400; }
  .btn { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .btn.mini { padding: 5px 9px; }
  .btn.armed { box-shadow: 0 0 0 1px #4ade80; }
  .rf { position: relative; display: inline-flex; }
  .rf input { background: #1e232b; color: #dde3ea; border: 1px solid #2a3038; border-radius: 6px; padding: 6px 22px 6px 10px; font-size: 13px; width: 170px; }
  .rf input.armed { outline: none; }
  #routeStart.armed { border-color: #60a5fa; box-shadow: 0 0 0 1px #60a5fa; }
  #routeEnd.armed { border-color: #f87171; box-shadow: 0 0 0 1px #f87171; }
  .clr { position: absolute; right: 1px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: #8b93a1; cursor: pointer; font-size: 14px; padding: 2px 6px; }
  .clr:hover { color: #dde3ea; }
  #routeBox { position: relative; display: flex; flex-direction: column; gap: 4px; }
  #routeBox[hidden] { display: none; }
  .rb-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .rb-center { justify-content: center; }
  #chipsRow[hidden] { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: #1e232b; border: 1px solid #2a3038; border-radius: 10px; padding: 1px 4px 1px 8px; font-size: 12px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .chip button { background: none; border: 0; color: #8b93a1; cursor: pointer; font-size: 13px; padding: 0 3px; }
  .chip button:hover { color: #dde3ea; }
  #routeCode { width: 300px; font-family: ui-monospace, monospace; }
  #routeResults { position: absolute; top: 110%; left: 0; min-width: 340px; max-height: 300px; overflow: auto; background: #1e232b; border: 1px solid #2a3038; border-radius: 6px; display: none; z-index: 10; }
  .btn:hover { background: #1d4fd7; }
  select { background: #1e232b; color: #dde3ea; border: 1px solid #2a3038; border-radius: 6px; padding: 6px 8px; font-size: 13px; max-width: 260px; }
  #status { color: #8b93a1; font-size: 13px; padding-top: 6px; }
  #status.ok { color: #4ade80; }
  #status.warn { color: #fbbf24; }
  #status.err { color: #f87171; }
  #wrap { flex: 1; position: relative; overflow: hidden; }
  canvas#cv { position: absolute; inset: 0; cursor: grab; }
  canvas#cv:active { cursor: grabbing; }
  #drop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,23,28,.85); font-size: 18px; color: #93c5fd; border: 2px dashed #2563eb; }
  #drop.on { display: flex; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; color: #5c6470; text-align: center; line-height: 1.6; pointer-events: none; }
  #empty code { display: inline-block; vertical-align: baseline; background: #1e232b; padding: 1px 6px; border-radius: 4px; line-height: inherit; }
  code { background: #1e232b; padding: 1px 6px; border-radius: 4px; }
  #progress { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(20,23,28,.72); }
  #progress.on { display: flex; }
  #progress .box { width: min(420px, 70%); text-align: center; }
  #progress .label { color: #93c5fd; font-size: 13px; margin-bottom: 10px; min-height: 20px; }
  #progress .track { height: 6px; background: #1e232b; border-radius: 3px; overflow: hidden; }
  #progress .bar { height: 100%; width: 0%; background: #2563eb; border-radius: 3px; transition: width .12s linear; }
  #progress .bar.indet { width: 30%; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
  /* zoom bar (top-right): - / fit / + and live ratio vs last fit */
  #zoomBar { position: absolute; top: 10px; right: 10px; z-index: 7; display: flex; gap: 4px; align-items: center; background: #1b1f26; border: 1px solid #2a3038; border-radius: 8px; padding: 4px 6px; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
  #zoomBar[hidden] { display: none; }
  #zoomBar button { background: #2563eb; color: #fff; border: 0; border-radius: 5px; min-width: 26px; height: 24px; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 5px; }
  #zoomBar button:hover { background: #1d4fd7; }
  #zoomPct { color: #8b93a1; font-size: 12px; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  /* room info panel (top-right, below the zoom bar) — unarmed click / search jump opens it */
  #roomPanel { position: absolute; top: 48px; right: 10px; width: 240px; background: #1b1f26; border: 1px solid #2a3038; border-radius: 8px; padding: 10px 12px; z-index: 6; font-size: 13px; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
  #roomPanel[hidden] { display: none; }
  #roomPanelX { position: absolute; top: 4px; right: 8px; background: none; border: 0; color: #8b93a1; cursor: pointer; font-size: 15px; padding: 2px 4px; }
  #roomPanelX:hover { color: #dde3ea; }
  .rp-row { color: #8b93a1; margin: 2px 0; word-wrap: break-word; }
  .rp-row b { color: #dde3ea; font-weight: 600; }
  /* geographic minimap (bottom-right) — real room coords of the current scope */
  #minimap { position: absolute; right: 10px; bottom: 10px; width: 180px; height: 120px; background: #0d0f12; border: 1px solid #2a3038; border-radius: 6px; z-index: 5; cursor: crosshair; }
  #minimap[hidden] { display: none; }
  /* schematic route overview (bottom-left) — step-delta polyline, not real coords */
  #routeOv { position: absolute; left: 10px; bottom: 10px; width: 200px; height: 140px; background: #0d0f12; border: 1px solid #2a3038; border-radius: 6px; z-index: 5; }
  #routeOv[hidden] { display: none; }
  #routeOvLabel { position: absolute; top: 4px; left: 8px; font-size: 10px; color: #8b93a1; pointer-events: none; letter-spacing: .4px; }
  #routeOvCv { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<header>
  <h1>arkmap-js <span>— demo viewer (npm package, zero deps)</span></h1>
  <button class="btn" id="open">Open .dat / .arkmap…</button>
  <button class="btn mini" id="expSvg" hidden title="export current area/level as a vector SVG (with route overlay)">SVG</button>
  <button class="btn mini" id="expPng" hidden title="export current area/level as PNG, 2x (with route overlay)">PNG</button>
  <input type="file" id="file" accept=".dat,.arkmap" hidden>
  <span id="routeBox" hidden>
    <div class="rb-row">
      <span class="rf"><input id="routeStart" placeholder="Start: name or #id…" autocomplete="off"><button class="clr" id="clrStart" title="clear start">×</button></span>
      <button class="btn mini" id="routeSwap" title="reverse the whole route">⇄</button>
      <span class="rf"><input id="routeEnd" placeholder="End: name or #id…" autocomplete="off"><button class="clr" id="clrEnd" title="clear end">×</button></span>
      <button class="btn mini" id="routeVia" title="add a waypoint before the end — then click a room">+Via</button>
      <select id="optAlgo" title="routing algorithm" style="max-width:none">
        <option value="dijkstra">Dijkstra</option><option value="astar">A*</option>
      </select>
      <select id="optDir" title="direction filter" style="max-width:none">
        <option value="all">all dirs</option><option value="cardinal">cardinal</option><option value="vertical">+vertical</option>
      </select>
      <select id="optTrans" title="transport lines" style="max-width:none">
        <option value="off">no transports</option><option value="normal">transports</option><option value="aggressive">transports (aggressive)</option>
      </select>
    </div>
    <div class="rb-row" id="chipsRow" hidden></div>
    <div class="rb-row rb-center">
      <span class="rf"><input id="routeCode" placeholder="route code: arkmap:…" autocomplete="off" title="live route code — paste a code and press Enter to import"></span>
      <button class="btn mini" id="routeCopy" title="copy route code to clipboard">Copy</button>
      <button class="btn mini" id="routeClear" title="clear route, waypoints, code and room highlight">Clear route</button>
      <button class="btn mini" id="routeFit" title="fit the route fragment of the current area in the window">Fit route</button>
    </div>
    <div id="routeResults"></div>
  </span>
  <span id="searchBox" hidden style="position:relative">
    <span class="rf"><input id="search" placeholder="Search room (name or #id)…" autocomplete="off" style="width:240px"><button class="clr" id="clrSearch" title="clear search and highlight">×</button></span>
    <div id="searchResults" style="position:absolute;top:110%;left:0;min-width:340px;max-height:300px;overflow:auto;background:#1e232b;border:1px solid #2a3038;border-radius:6px;display:none;z-index:10"></div>
  </span>
  <select id="selArea" hidden></select>
  <select id="selZ" hidden></select>
  <span id="status">no map loaded — drop a file anywhere</span>
</header>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="empty"><div>Drop a Mudlet <code>.dat</code> or <code>.arkmap</code> file here.</div><div>Parsing, validation and checksums run locally via the <code>arkmap-js</code> package.</div></div>
  <div id="progress"><div class="box"><div class="label">loading…</div><div class="track"><div class="bar"></div></div></div></div>
  <div id="drop">drop to load</div>
  <div id="zoomBar" hidden>
    <button id="zoomOut" title="zoom out">−</button>
    <button id="zoomFit" title="fit to window">⤢</button>
    <button id="zoomIn" title="zoom in">+</button>
    <span id="zoomPct">100%</span>
  </div>
  <div id="roomPanel" hidden>
    <button id="roomPanelX" title="close">×</button>
    <div id="roomPanelBody"></div>
  </div>
  <canvas id="minimap" width="180" height="120" hidden></canvas>
  <div id="routeOv" hidden>
    <div id="routeOvLabel">ROUTE</div>
    <canvas id="routeOvCv" width="200" height="140"></canvas>
  </div>
</div>
<script src="arkmap.bundle.js"></script>
<script>
'use strict';
const A = globalThis.arkmap;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const statusEl = document.getElementById('status'), emptyEl = document.getElementById('empty');
const selArea = document.getElementById('selArea'), selZ = document.getElementById('selZ');
const progEl = document.getElementById('progress'), progBar = progEl.querySelector('.bar'), progLabel = progEl.querySelector('.label');
const searchEl = document.getElementById('search'), searchRes = document.getElementById('searchResults');
const startEl = document.getElementById('routeStart'), endEl = document.getElementById('routeEnd');
const routeRes = document.getElementById('routeResults'), routeBox = document.getElementById('routeBox');
const optAlgoEl = document.getElementById('optAlgo'), optDirEl = document.getElementById('optDir'),
      optTransEl = document.getElementById('optTrans');
const viaBtn = document.getElementById('routeVia'), chipsRow = document.getElementById('chipsRow');
const codeEl = document.getElementById('routeCode');
const roomPanel = document.getElementById('roomPanel'), roomPanelBody = document.getElementById('roomPanelBody');
const mmEl = document.getElementById('minimap');
const ovEl = document.getElementById('routeOv'), ovc = document.getElementById('routeOvCv');
const zoomBar = document.getElementById('zoomBar'), zoomPct = document.getElementById('zoomPct');

let map = null, view = { x: 0, y: 0, scale: 14 };
let roomIdx = new Map();          // roomId -> { room, areaId, areaName } (A.buildIndex)
let scope = { areaId: 'all', z: null };
let routeStart = null;            // roomId — first route waypoint (Start field / armed click)
let routeEnd = null;              // roomId — last route waypoint (End field / armed click)
let routeVias = [];               // [roomId, ...] — intermediate waypoints (between Start and End)
let highlightRoom = null;         // roomId — highlight from the general search / inspection
let _lastCrossArrows = [];        // cross-area arrows from the last draw() — dblclick hit-test
let routeLegs = [];               // [{from,to,path,hops}|null] — plan legs (A.planRoute)
let planComplete = true, planTotal = 0;
let armedField = null;            // 'start' | 'end' | 'via' | null — waiting for a room click
let loadedMsg = 'no map loaded — drop a file anywhere', loadedCls = '';
let ovGeom = null;                // schematic route-preview geometry (cache)
let mmDirty = true, mmCache = null, mmXf = null, mmDrag = false;  // geographic minimap
let lastFitScale = null;          // skala ostatniego fit — baza procentu na pasku zoomu
let colorCache = null;            // RENDER_MODEL.buildColorCache(map) — rebuilt on load
let modelById = new Map();        // roomId -> room (render model plane lookups)
let modelAreaOf = new Map();      // roomId -> areaId
let mapSeq = 0;                   // load counter — raster cache key
let rasterCache = null;           // { key, canvas, minX, maxY, cols, rows }

// waypoint marker colors (cycle) — shared by map rings, chips and the route overview
const WP_COLORS = ['#00c896', '#4a90e8', '#e84a90', '#e8c84a', '#a04ae8'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Mudlet direction deltas (data coords; screen Y is negated at draw time)
const DELTA = { n: [0, 1], ne: [1, 1], e: [1, 0], se: [1, -1], s: [0, -1], sw: [-1, -1], w: [-1, 0], nw: [-1, 1] };

function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }

// uniform loading progress for both formats: determinate while bytes arrive, indeterminate while parsing
function progStart(label) { progEl.classList.add('on'); progLabel.textContent = label; progBar.classList.remove('indet'); progBar.style.width = '0%'; }
function progSet(frac, label) { progBar.classList.remove('indet'); progBar.style.width = Math.round(frac * 100) + '%'; if (label) progLabel.textContent = label; }
function progParsing(label) { progBar.classList.add('indet'); if (label) progLabel.textContent = label; }
function progDone() { progEl.classList.remove('on'); }

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  draw();
}
addEventListener('resize', resize);
// header grows/shrinks when route controls (un)hide or chips appear — keep the
// canvas backing store in sync with the layout box, otherwise fit/pick calc
// uses stale dimensions and the view looks cropped
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => resize()).observe(cv.parentElement);

// Studio color chain 1:1 via the shared render model (ANSI implicit with the
// 8/16 Mudlet quirk < ARKADIA_ENVS < env_colors < custom_env_colors; unknown
// env -> dark red DEFAULT_ROOM_RGB). The 2nd arg is kept for call-site compat.
function envColor(env, colors) {
  if (!colorCache) colorCache = A.RENDER_MODEL.buildColorCache(map);
  return A.RENDER_MODEL.roomColorCss(colorCache, env);
}

function visible(room, areaId) {
  if (scope.areaId !== 'all' && areaId !== scope.areaId) return false;
  if (scope.z !== null && (room.z ?? 0) !== scope.z) return false;
  return true;
}

function roomsInScope() {
  const out = [];
  for (const area of map?.areas || []) {
    for (const room of area.rooms || []) {
      if (visible(room, area.id)) out.push(room);
    }
  }
  return out;
}

// glyph (symbol / special-exit marker) from a model op: font size in map
// units — the canvas transform scales it to exactly op.fontUnits*view.scale px
function drawGlyph(op) {
  ctx.font = `${op.fontUnits}px system-ui, sans-serif`;
  ctx.textAlign = op.anchor === 'end' ? 'right' : 'center';
  ctx.textBaseline = op.baseline === 'top' ? 'top' : 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = op.haloWidth; ctx.strokeStyle = op.halo;
  ctx.strokeText(op.text, op.x, op.y);
  ctx.fillStyle = op.fill;
  ctx.fillText(op.text, op.x, op.y);
}

// map labels (area.labels): text with fg color and outline, or the original
// pixmap (data URI, cached per area|id); top=false below rooms, true above.
// no_scaling = fixed size in px regardless of zoom (as in ArkMap Studio).
const labelImgCache = new Map();
function drawMapLabels(top) {
  if (!map || view.scale < 4) return;   // przy duzym oddaleniu etykiety nieczytelne
  for (const area of map.areas || []) {
    if (scope.areaId !== 'all' && area.id !== scope.areaId) continue;
    for (const lbl of area.labels || []) {
      if (scope.z !== null && lbl.z !== undefined && lbl.z !== scope.z) continue;
      if (!!lbl.show_on_top !== top) continue;
      if (!lbl.text && !lbl.pixmap) continue;
      const ns = lbl.no_scaling ? 20 / view.scale : 1;   // 20 px/jednostke przy skali 1
      const W = (lbl.width ?? 4) * ns, H = (lbl.height ?? 1.2) * ns;
      const x = lbl.x ?? 0, y = -(lbl.y ?? 0);
      // Studio parity: no background rect behind labels (halo only)
      if (lbl.text) {
        let fg = Array.isArray(lbl.fg_color) ? lbl.fg_color : [200, 200, 100];
        const bright = (fg[0] * 299 + fg[1] * 587 + fg[2] * 114) / 1000;
        if (bright < 60) fg = [200, 200, 80];   // podbicie ciemnych kolorow (jak Studio)
        const ratio = Math.min(0.75, W / Math.max(lbl.text.length / 2, 1));
        const fs = Math.max(0.1 * ns, Math.min(ratio, Math.max(H * 0.9, 0.1 * ns)));
        ctx.font = `${fs}px system-ui, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = Math.max(0.03, fs * 0.12); ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineJoin = 'round';
        ctx.strokeText(lbl.text, x + W / 2, y + H / 2);
        ctx.fillStyle = `rgb(${fg[0]},${fg[1]},${fg[2]})`;
        ctx.fillText(lbl.text, x + W / 2, y + H / 2);
      } else if (lbl.pixmap && typeof Image !== 'undefined') {
        const key = area.id + '|' + lbl.id;
        let c = labelImgCache.get(key);
        if (!c) {
          c = { img: new Image(), loaded: false };
          c.img.onload = () => { c.loaded = true; draw(); };
          c.img.src = 'data:image/png;base64,' + lbl.pixmap;
          labelImgCache.set(key, c);
        }
        if (c.loaded) ctx.drawImage(c.img, x, y, W, H);
      }
    }
  }
}

// cross-area exit LABELS 1:1 as in ArkMap Studio (drawCrossAreaLabels):
// drawn in screen pixels (after restore); arrows themselves are drawn by the
// render model in map space (drawExitsModel). Labels hidden below cellPx 9
// (Studio zoom 0.5). Fixed 8-11px font, smart placement (3 positions, first
// without room collisions), box with background, clipped into the viewport.
function drawCrossArrowOverlay() {
  if (!map || !_lastCrossArrows.length) return;
  const RM = A.RENDER_MODEL;
  const cellPx = view.scale, zoom = cellPx / RM.CELL;
  const W = cv.width / devicePixelRatio, H = cv.height / devicePixelRatio;
  const toSX = (mx) => W / 2 + view.x + mx * view.scale;
  const toSY = (my) => H / 2 + view.y + my * view.scale;   // my already in screen coordinates
  const rsPx = Math.max(2, RM.ROOM_UNITS * cellPx);
  const hw = Math.max(1.5, rsPx * 0.35);
  const vis = roomsInScope();
  for (const a of _lastCrossArrows) {
    const ex = toSX(a.op.line[0]), ey = toSY(a.op.line[1]);
    const ax = toSX(a.op.line[2]), ay = toSY(a.op.line[3]);
    a.smx = (ex + ax) / 2; a.smy = (ey + ay) / 2;          // hit-test dblclick (px ekranu)
    a.hitR = Math.max(15, Math.hypot(ax - ex, ay - ey) * 1.5);
    a.stx = ax; a.sty = ay;                                // kotwica etykiety
    const l = Math.hypot(a.op.line[2] - a.op.line[0], a.op.line[3] - a.op.line[1]) || 1;
    a.ux = (a.op.line[2] - a.op.line[0]) / l; a.uy = (a.op.line[3] - a.op.line[1]) / l;
  }
  if (cellPx < RM.CELL * 0.5) return;                      // Studio: etykiety od zoomu 0.5
  const fontSize = Math.max(8, Math.min(11, zoom * 8));
  const alongOff = hw * 2.0 + 6;
  const perpOff = Math.max(rsPx * 1.2, 14);
  const rh = rsPx * 0.55;
  ctx.font = `${fontSize}px sans-serif`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const a of _lastCrossArrows) {
    if (a.stx === undefined) continue;
    const labelStr = a.areaName || (a.target ? String(a.targetId) : '?');
    const vx = a.ux, vy = a.uy;
    const tm = ctx.measureText(labelStr);
    const tw = tm.width + 6, th = fontSize + 4;
    const pxv = -vy, pyv = vx;
    const candidates = [
      [a.stx + vx * alongOff + pxv * perpOff, a.sty + vy * alongOff + pyv * perpOff],
      [a.stx + vx * alongOff - pxv * perpOff, a.sty + vy * alongOff - pyv * perpOff],
      [a.stx + vx * (perpOff * 2.5 + alongOff), a.sty + vy * (perpOff * 2.5 + alongOff)],
    ];
    let bestIdx = 0;
    for (let ci = 0; ci < candidates.length; ci++) {
      const tbx = candidates[ci][0] - 2, tby = candidates[ci][1] - th / 2;
      let collision = false;
      for (const r of vis) {
        const rx = toSX(r.x), ry = toSY(-r.y);
        if (tbx + tw > rx - rh && tbx < rx + rh && tby + th > ry - rh && tby < ry + rh) { collision = true; break; }
      }
      bestIdx = ci;                                        // fallback: ostatnia (jak w Studio)
      if (!collision) break;
    }
    let lx = candidates[bestIdx][0], ly = candidates[bestIdx][1];
    let bx = lx - 2, by = ly - th / 2;
    const margin = 2;
    if (bx < margin) { const d = margin - bx; bx += d; lx += d; }
    if (by < margin) { const d = margin - by; by += d; ly += d; }
    if (bx + tw > W - margin) { const d = (bx + tw) - (W - margin); bx -= d; lx -= d; }
    if (by + th > H - margin) { const d = (by + th) - (H - margin); by -= d; ly -= d; }
    ctx.fillStyle = 'rgba(10,12,18,0.82)';
    ctx.fillRect(bx, by, tw, th);
    ctx.strokeStyle = 'rgba(255,159,74,0.35)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(bx, by, tw, th);
    ctx.fillStyle = '#ffb86c';
    ctx.fillText(labelStr, lx, ly);
  }
}

// ── model-driven drawing (ArkMap Studio 1:1 via A.RENDER_MODEL) ─────────────

function _planeFor(room) {
  const entry = roomIdx.get(room.id);
  return { byId: modelById, areaOf: modelAreaOf, areaId: entry ? entry.areaId : null, z: room.z ?? 0 };
}

// Studio drawExits + drawStubs + drawCustomLines (full LOD): edge-to-edge
// lines, one-way dashed + red head, doors as DOOR_RGB squares, data stubs,
// custom lines (incl. special exits), suppressors; cross-area exits become
// arrows here (map space) and get labels later in drawCrossArrowOverlay.
function drawExitsModel(vis, cellPx) {
  const RM = A.RENDER_MODEL;
  const crossArrows = [];
  const drawArrow = (op) => {
    ctx.strokeStyle = op.color; ctx.lineWidth = op.width; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(op.line[0], op.line[1]); ctx.lineTo(op.line[2], op.line[3]); ctx.stroke();
    ctx.fillStyle = op.color;
    ctx.beginPath();
    ctx.moveTo(op.head[0][0], op.head[0][1]);
    ctx.lineTo(op.head[1][0], op.head[1][1]);
    ctx.lineTo(op.head[2][0], op.head[2][1]);
    ctx.closePath(); ctx.fill();
  };
  for (const room of vis) {
    const plane = _planeFor(room);
    for (const [dir, tgt] of Object.entries(room.exits || {})) {
      const cls = RM.classifyExit(room, dir, tgt, plane);
      if (cls.kind === 'line' || cls.kind === 'oneway') {
        const op = RM.exitLineOp(room, cls.target, RM.DIR_VEC[dir], cellPx, cls.kind === 'oneway');
        ctx.strokeStyle = op.color; ctx.lineWidth = op.width; ctx.setLineDash(op.dash);
        ctx.beginPath(); ctx.moveTo(op.line[0], op.line[1]); ctx.lineTo(op.line[2], op.line[3]); ctx.stroke();
        ctx.setLineDash([]);
        if (op.head) {
          ctx.fillStyle = op.head.fill; ctx.strokeStyle = op.head.outline; ctx.lineWidth = op.width;
          ctx.beginPath();
          ctx.moveTo(op.head.tip[0], op.head.tip[1]);
          ctx.lineTo(op.head.base1[0], op.head.base1[1]);
          ctx.lineTo(op.head.base2[0], op.head.base2[1]);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        const door = (room.doors || {})[dir];
        if (door) {   // Studio: door square at the midpoint of the drawn line
          const d = RM.doorSquareOp((op.line[0] + op.line[2]) / 2, (op.line[1] + op.line[3]) / 2, door, cellPx);
          ctx.strokeStyle = d.color; ctx.lineWidth = d.width; ctx.setLineDash([]);
          ctx.strokeRect(d.cx - d.side / 2, d.cy - d.side / 2, d.side, d.side);
        }
      } else if (cls.kind === 'cross') {
        const op = RM.crossArrowOp(room, RM.DIR_VEC[dir], cls.target, colorCache, cellPx);
        if (op) {
          drawArrow(op);
          crossArrows.push({ op, targetId: tgt, target: cls.target,
            areaName: cls.target ? (roomIdx.get(tgt)?.areaName || '') : '' });
        }
      }
      // 'custom' / 'suppressed' -> custom-lines pass below; 'udio' / 'crossZ' / 'skip' -> nothing
    }
    // cross-area SPECIAL exits (Studio 8523-8540)
    for (const sc of RM.specialCrossArrows(room, plane, colorCache, cellPx)) {
      drawArrow(sc.op);
      crossArrows.push({ op: sc.op, targetId: sc.targetId, target: sc.target,
        areaName: roomIdx.get(sc.targetId)?.areaName || '' });
    }
    // stubs from DATA (Studio drawStubs)
    for (const st of RM.stubOps(room, cellPx)) {
      ctx.strokeStyle = st.color; ctx.lineWidth = st.width; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(st.line[0], st.line[1]); ctx.lineTo(st.line[2], st.line[3]); ctx.stroke();
    }
    // custom lines (Studio drawCustomLines) — incl. special exits and u/d;
    // empty points = suppressor (nothing drawn)
    for (const [dir, cl] of Object.entries(room.custom_lines || {})) {
      if (!cl.points || !cl.points.length) continue;
      const op = RM.customLineOp(room, dir, cl, cellPx);
      ctx.strokeStyle = op.color; ctx.lineWidth = op.width; ctx.setLineDash(op.dash);
      ctx.beginPath();
      ctx.moveTo(op.points[0][0], op.points[0][1]);
      for (let i = 1; i < op.points.length; i++) ctx.lineTo(op.points[i][0], op.points[i][1]);
      ctx.stroke();
      ctx.setLineDash([]);
      if (op.door) {
        ctx.strokeStyle = op.door.color; ctx.lineWidth = op.door.width;
        ctx.strokeRect(op.door.cx - op.door.side / 2, op.door.cy - op.door.side / 2, op.door.side, op.door.side);
      }
      if (op.arrow) {
        ctx.fillStyle = op.arrow.color;
        ctx.beginPath();
        ctx.moveTo(op.arrow.tip[0], op.arrow.tip[1]);
        ctx.lineTo(op.arrow.base1[0], op.arrow.base1[1]);
        ctx.lineTo(op.arrow.base2[0], op.arrow.base2[1]);
        ctx.closePath(); ctx.fill();
      }
    }
  }
  return crossArrows;
}

// Studio drawRooms: stack shadows behind, then room squares (clamped rs,
// hidden faded/dashed, custom border), inner u/d/i/o triangles, symbols, ✦
function drawRoomsModel(vis, cellPx) {
  const RM = A.RENDER_MODEL;
  for (const room of vis) {
    for (const sh of RM.stackShadowsOp(room, cellPx) || []) {
      ctx.strokeStyle = sh.color; ctx.lineWidth = sh.width; ctx.setLineDash([]);
      ctx.strokeRect(sh.x, sh.y, sh.size, sh.size);
    }
  }
  for (const room of vis) {
    const ro = RM.roomOp(room, colorCache, cellPx, 'faded');
    if (ro.skip) continue;
    ctx.save();
    ctx.globalAlpha = ro.alpha;
    ctx.fillStyle = ro.fill;
    ctx.fillRect(ro.x - ro.half, ro.y - ro.half, ro.half * 2, ro.half * 2);
    ctx.strokeStyle = ro.border; ctx.lineWidth = ro.borderWidth; ctx.setLineDash(ro.dash);
    ctx.strokeRect(ro.x - ro.half, ro.y - ro.half, ro.half * 2, ro.half * 2);
    ctx.setLineDash([]);
    for (const tri of RM.innerTrianglesOp(room, colorCache, cellPx) || []) {
      ctx.fillStyle = tri.fill; ctx.strokeStyle = tri.stroke; ctx.lineWidth = tri.width;
      ctx.beginPath();
      ctx.moveTo(tri.points[0][0], tri.points[0][1]);
      ctx.lineTo(tri.points[1][0], tri.points[1][1]);
      ctx.lineTo(tri.points[2][0], tri.points[2][1]);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    const sym = RM.symbolOp(room, colorCache, cellPx);
    if (sym) drawGlyph(sym);
    const se = RM.seMarkerOp(room, colorCache, cellPx);
    if (se) drawGlyph(se);
    ctx.restore();
  }
}

// Studio LOD roomsOnly (drawExitsLite + drawRooms): one batched path of
// center-to-center lines rgba(225,225,225,0.45), two-way dedup lower id,
// one-way always; rooms keep full vector detail (zoom gates apply).
function drawRoomsOnly(vis, cellPx) {
  const RM = A.RENDER_MODEL;
  ctx.beginPath();
  let n = 0;
  const seen = new Set();
  for (const room of vis) {
    const plane = _planeFor(room);
    for (const [dir, tgt] of Object.entries(room.exits || {})) {
      const cls = RM.classifyExit(room, dir, tgt, plane);
      if (cls.kind !== 'line' && cls.kind !== 'oneway') continue;
      if (cls.kind === 'line') {
        const key = room.id < tgt ? room.id + '>' + tgt : tgt + '>' + room.id;
        if (seen.has(key)) continue;
        seen.add(key);
      }
      ctx.moveTo(room.x, -room.y); ctx.lineTo(cls.target.x, -cls.target.y); n++;
    }
  }
  if (n) {
    ctx.strokeStyle = 'rgba(225,225,225,0.45)';
    ctx.lineWidth = Math.max(0.5, (cellPx / RM.CELL) * 0.5) / cellPx;
    ctx.setLineDash([]);
    ctx.stroke();
  }
  drawRoomsModel(vis, cellPx);
}

// Studio LOD raster (_buildRoomsRaster + drawRoomsRaster): one cell per map
// unit, exit lines alpha 140 under rooms, Y-flip, hidden faded 89; nearest
// neighbor blit. Cached per map+scope.
function drawRasterModel(vis, cellPx) {
  const RM = A.RENDER_MODEL;
  const key = mapSeq + '|' + scope.areaId + '|' + scope.z;
  if (!rasterCache || rasterCache.key !== key) {
    const ras = RM.rasterModel(vis, modelById, colorCache, 'faded');
    const off = document.createElement('canvas');
    off.width = ras.cols; off.height = ras.rows;
    off.getContext('2d').putImageData(new ImageData(ras.buf, ras.cols, ras.rows), 0, 0);
    rasterCache = { key, canvas: off, minX: ras.minX, maxY: ras.maxY, cols: ras.cols, rows: ras.rows };
  }
  const c = rasterCache;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(c.canvas, c.minX - 0.5, -c.maxY - 0.5, c.cols, c.rows);
  ctx.restore();
}

function draw() {
  zoomPct.textContent = Math.round(view.scale / (lastFitScale || view.scale) * 100) + '%';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!map) { drawMinimap(); drawRouteOv(); return; }
  const RM = A.RENDER_MODEL;
  const W = cv.width / devicePixelRatio, H = cv.height / devicePixelRatio;
  const cellPx = view.scale;              // px per map unit == Studio CELL*zoom
  ctx.save();
  ctx.translate(W / 2 + view.x, H / 2 + view.y);
  ctx.scale(view.scale, view.scale);

  const vis = roomsInScope();
  const visIds = new Set(vis.map(r => r.id));

  // Studio drawGrid: 1-unit world grid, alpha tiers by cellPx, 1px lines
  const grid = RM.gridStyle(cellPx);
  if (grid && vis.length) {
    const x0 = Math.floor(-(W / 2 + view.x) / view.scale), x1 = Math.ceil((W / 2 - view.x) / view.scale);
    const y0 = Math.floor(-(H / 2 + view.y) / view.scale), y1 = Math.ceil((H / 2 - view.y) / view.scale);
    ctx.strokeStyle = `rgba(255,255,255,${grid.alpha})`; ctx.lineWidth = grid.widthPx / cellPx;
    ctx.setLineDash([]);
    ctx.beginPath();
    for (let x = x0; x <= x1; x++) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = y0; y <= y1; y++) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
  }

  // Studio computeLodMode; the raster is a single-plane structure, so the
  // 'all' scope degrades to roomsOnly (vector), never a wrong bitmap
  let mode = RM.lodMode(vis.length, cellPx, W, H);
  if (mode === 'raster' && (scope.areaId === 'all' || scope.z === null)) mode = 'roomsOnly';
  if (mode === 'raster' && (typeof ImageData === 'undefined' || typeof document.createElement !== 'function')) mode = 'roomsOnly';

  if (mode !== 'full') {
    if (mode === 'raster') drawRasterModel(vis, cellPx); else drawRoomsOnly(vis, cellPx);
    ctx.restore();
    _lastCrossArrows = [];
    globalThis.__arkmapCrossArrows = _lastCrossArrows;
    globalThis.__arkmapView = view;
    drawMinimap();
    drawRouteOv();
    return;
  }

  // Studio layer order: exits -> stubs -> custom lines -> labels (under)
  // -> rooms (+details) -> [cross labels post-restore] -> labels on top
  _lastCrossArrows = drawExitsModel(vis, cellPx);
  globalThis.__arkmapCrossArrows = _lastCrossArrows;   // hak smoke-harnessa
  globalThis.__arkmapView = view;                      // hak smoke-harnessa (aktualny zoom/przesuniecie)

  drawMapLabels(false);
  drawRoomsModel(vis, cellPx);
  drawMapLabels(true);

  // route overlay: per leg (segments between waypoints); hops (transport) dashed
  if (routeLegs.length) {
    ctx.lineCap = 'round';
    for (const leg of routeLegs) {
      if (!leg || !leg.path || leg.path.length < 2) continue;
      for (let i = 0; i + 1 < leg.path.length; i++) {
        const a = roomIdx.get(leg.path[i])?.room, b = roomIdx.get(leg.path[i + 1])?.room;
        if (!a || !b || !visIds.has(a.id) || !visIds.has(b.id)) continue;
        const hop = leg.hops?.[i];
        ctx.setLineDash(hop ? [0.7, 0.7] : []);
        ctx.strokeStyle = hop ? '#fbbf24' : '#f87171';
        ctx.lineWidth = 0.3;
        ctx.beginPath(); ctx.moveTo(a.x, -a.y); ctx.lineTo(b.x, -b.y); ctx.stroke();
      }
    }
    ctx.setLineDash([]);
    ctx.lineCap = 'butt';
  }

  // highlight: route start (blue), route end (red), intermediate waypoints
  // (color cycle as on the route minimap), search result (white-orange)
  const rs = RM.ROOM_HALF;
  const ring = (room, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 0.22;
    ctx.strokeRect(room.x - rs - 0.14, -room.y - rs - 0.14, (rs + 0.14) * 2, (rs + 0.14) * 2);
  };
  if (routeStart != null) {
    const e = roomIdx.get(routeStart);
    if (e && visible(e.room, e.areaId)) ring(e.room, '#60a5fa');
  }
  if (routeEnd != null) {
    const e = roomIdx.get(routeEnd);
    if (e && visible(e.room, e.areaId)) ring(e.room, '#f87171');
  }
  for (let i = 0; i < routeVias.length; i++) {
    const e = roomIdx.get(routeVias[i]);
    if (e && visible(e.room, e.areaId)) ring(e.room, WP_COLORS[(i + 1) % WP_COLORS.length]);
  }
  if (highlightRoom != null) {
    const e = roomIdx.get(highlightRoom);
    if (e && visible(e.room, e.areaId)) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.3;
      ctx.strokeRect(e.room.x - rs - 0.26, -e.room.y - rs - 0.26, (rs + 0.26) * 2, (rs + 0.26) * 2);
      ring(e.room, '#fb923c');
    }
  }
  ctx.restore();

  drawCrossArrowOverlay();   // cross-area labels in screen px — 1:1 as in Studio

  drawMinimap();
  drawRouteOv();
}

function fit() {
  if (!map) return;
  const pts = roomsInScope();
  if (!pts.length) return;
  const xs = pts.map(r => r.x), ys = pts.map(r => -r.y);
  fitBBox(Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys));
}

function fitBBox(minX, maxX, minY, maxY) {   // minY/maxY in screen space (-room.y)
  const W = cv.width / devicePixelRatio, H = cv.height / devicePixelRatio;
  // lower clamp 0.05 (not 2): with large areas / "all areas" the fit MUST be able
  // to zoom out below 2, otherwise the map is clipped; +4 units margin per side
  view.scale = Math.max(0.05, Math.min(40, Math.min(W / (maxX - minX + 4), H / (maxY - minY + 4))));
  view.x = -(minX + maxX) / 2 * view.scale;
  view.y = -(minY + maxY) / 2 * view.scale;
  lastFitScale = view.scale;
}

// fitRouteToView (as in ArkMap Studio): fit the route fragment in the CURRENT area+Z;
// if nothing from the route lies in range — jump to the first waypoint's area and fit there.
function fitRoute() {
  if (!map) return;
  const wps = effectiveWps();
  if (!wps.length) { setStatus('no route to fit', 'warn'); return; }
  const collect = () => {
    const ids = new Set();
    for (const leg of routeLegs) {
      if (!leg || !leg.path) continue;
      for (const id of leg.path) ids.add(id);
      for (const h of leg.hops || []) {
        if (!h) continue;
        const via = hopViaRooms(h);   // intermediate stops of land rides go into the bbox too
        if (via) for (const id of via) ids.add(id);
      }
    }
    if (!ids.size) for (const id of wps) ids.add(id);
    return [...ids].map(id => roomIdx.get(id)).filter(e => e && visible(e.room, e.areaId)).map(e => e.room);
  };
  let pts = collect();
  if (!pts.length) {
    const e = roomIdx.get(wps[0]);
    if (!e) return;
    scope.areaId = e.areaId; scope.z = e.room.z ?? 0;
    selArea.value = String(scope.areaId);
    populateZ();
    selZ.value = String(scope.z);
    mmDirty = true;
    pts = collect();
    if (!pts.length) pts = [e.room];
  }
  const xs = pts.map(r => r.x), ys = pts.map(r => -r.y);
  fitBBox(Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys));
  draw();
}

function populateSelectors() {
  const areas = (map.areas || []).filter(a => (a.rooms || []).length > 0);
  const largest = areas.reduce((m, a) => (a.rooms.length > (m?.rooms.length || 0) ? a : m), null);
  areas.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'pl'));   // alfabetycznie, jak OBSZARY w ArkMap Studio
  const total = areas.reduce((s, a) => s + a.rooms.length, 0);
  selArea.innerHTML = '';
  const all = document.createElement('option');
  all.value = 'all'; all.textContent = `All areas (${total} rooms)`;
  selArea.appendChild(all);
  for (const a of areas) {
    const o = document.createElement('option');
    o.value = String(a.id);
    o.textContent = `${a.name || 'area ' + a.id} — ${a.rooms.length} rooms`;
    selArea.appendChild(o);
  }
  scope.areaId = largest ? largest.id : 'all';   // default view: largest area
  selArea.value = String(scope.areaId);
  populateZ();
  selArea.hidden = selZ.hidden = false;
}

function populateZ() {
  const counts = new Map();
  for (const area of map.areas || []) {
    if (scope.areaId !== 'all' && area.id !== scope.areaId) continue;
    for (const room of area.rooms || []) {
      const z = room.z ?? 0;
      counts.set(z, (counts.get(z) || 0) + 1);
    }
  }
  const zs = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  selZ.innerHTML = '';
  for (const [z, n] of [...zs].sort((a, b) => a[0] - b[0])) {
    const o = document.createElement('option');
    o.value = String(z); o.textContent = `z = ${z} (${n} rooms)`;
    selZ.appendChild(o);
  }
  // keep the current level if it exists in range (a room jump sets z before populateZ);
  // inaczej default: most populated level
  if (scope.z === null || !counts.has(scope.z)) scope.z = zs.length ? zs[0][0] : null;
  if (scope.z !== null) selZ.value = String(scope.z);
}

selArea.onchange = () => {
  scope.areaId = selArea.value === 'all' ? 'all' : parseInt(selArea.value);
  populateZ(); mmDirty = true; fit(); draw();
};
selZ.onchange = () => { scope.z = parseInt(selZ.value); mmDirty = true; fit(); draw(); };

let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (!drag) return; drag.moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y); view.x += e.clientX - drag.x; view.y += e.clientY - drag.y; drag = { x: e.clientX, y: e.clientY, moved: drag.moved }; draw(); });
cv.addEventListener('pointerup', e => {
  const wasClick = drag && drag.moved < 5;
  drag = null;
  if (wasClick && map) pickRoom(e);
});

// dblclick: jump behind a cross-area arrow to the target area/room
// (as in ArkMap Studio; fallback: a room with exactly one cross-area exit,
// with several — the direction closest to the click)
cv.addEventListener('dblclick', e => {
  if (!map) return;
  const rect = cv.getBoundingClientRect();
  const W = cv.width / devicePixelRatio, H = cv.height / devicePixelRatio;
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;   // px ekranu (jak Studio)
  const wx = (sx - W / 2 - view.x) / view.scale;
  const wy = (sy - H / 2 - view.y) / view.scale;
  let best = null, bestD = Infinity;
  for (const a of _lastCrossArrows) {
    if (a.targetId == null || a.smx === undefined) continue;
    const d = Math.hypot(sx - a.smx, sy - a.smy);
    if (d < (a.hitR || 15) && d < bestD) { bestD = d; best = a; }
  }
  if (best) { jumpToRoom(best.targetId); return; }
  let near = null, nearD = 0.6;
  for (const room of roomsInScope()) {
    const d = Math.max(Math.abs(room.x - wx), Math.abs(-room.y - wy));
    if (d < nearD) { nearD = d; near = room; }
  }
  if (!near) return;
  const cross = [];
  for (const [dir, tgt] of Object.entries(near.exits || {})) {
    const t = roomIdx.get(tgt);
    if (t && !visRoom(t)) cross.push([dir, tgt]);
  }
  for (const [cmd, tgt] of Object.entries(near.special_exits || {})) {
    const t = roomIdx.get(tgt);
    if (t && !visRoom(t)) cross.push([cmd, tgt]);
  }
  if (cross.length === 1) { jumpToRoom(cross[0][1]); return; }
  if (cross.length > 1) {
    const relX = wx - near.x, relY = wy - (-near.y);
    let pick = null, bestDot = 0.1;
    for (const [dir, tgt] of cross) {
      let v = DELTA[dir];
      if (v) v = [v[0], -v[1]];
      else { const t = roomIdx.get(tgt).room; const vx = t.x - near.x, vy = -(t.y - near.y); const l = Math.hypot(vx, vy) || 1; v = [vx / l, vy / l]; }
      const dot = relX * v[0] + relY * v[1];
      if (dot > bestDot) { bestDot = dot; pick = tgt; }
    }
    if (pick != null) jumpToRoom(pick);
  }
});
function visRoom(entry) { return visible(entry.room, entry.areaId); }

// room click: armed Start/End field = set endpoint; +Via = insert waypoint;
// when not armed = inspection (room info panel + status)
function pickRoom(e) {
  const rect = cv.getBoundingClientRect();
  const W = cv.width / devicePixelRatio, H = cv.height / devicePixelRatio;
  const wx = (e.clientX - rect.left - W / 2 - view.x) / view.scale;
  const wy = (e.clientY - rect.top - H / 2 - view.y) / view.scale;
  let best = null, bestD = 0.6;   // promien trafienia w jednostkach mapy
  for (const room of roomsInScope()) {
    const d = Math.hypot(room.x - wx, -room.y - wy);
    if (d < bestD) { best = room; bestD = d; }
  }
  if (!best) return;
  if (armedField === 'via') {
    addVia(best.id);
    disarm();
  } else if (armedField) {
    setEndpoint(armedField, best.id);
    disarm();
    startEl.blur(); endEl.blur();
  } else {
    const e2 = roomIdx.get(best.id);
    openRoomPanel(best.id);
    searchEl.value = best.name || String(best.id);   // room typed into the search as if by hand
    setStatus(`${best.name || 'room'} (#${best.id}) — ${e2 ? e2.areaName : '?'}, z=${best.z ?? 0}`, '');
  }
  draw();
}

function setEndpoint(side, roomId) {
  const e = roomIdx.get(roomId);
  if (!e) return;
  if (side === 'start') { routeStart = roomId; startEl.value = e.room.name || String(roomId); }
  else { routeEnd = roomId; endEl.value = e.room.name || String(roomId); }
  recomputeRoute();
}

// +Via: first free slot — Start, then End, then an intermediate waypoint before End
function addVia(roomId) {
  const e = roomIdx.get(roomId);
  if (!e) return;
  if (routeStart == null) { routeStart = roomId; startEl.value = e.room.name || String(roomId); }
  else if (routeEnd == null) { routeEnd = roomId; endEl.value = e.room.name || String(roomId); }
  else routeVias.push(roomId);
  recomputeRoute();
}

function effectiveWps() {   // waypoints in order: start, intermediate, end (no empties)
  return [routeStart, ...routeVias, routeEnd].filter(x => x != null);
}

// transports: map-embedded ones (map.transports) take precedence; for an Arkadia
// map without its own lines we add the package data layer
function transportsFor() {
  if (optTransEl.value === 'off' || !map) return null;
  if (map.transports) return map.transports;
  return A.isArkadiaMap(map) ? A.ARKADIA_TRANSPORTS : null;
}

// A land ride (wagon/stagecoach/carriage) broken down into real road rooms —
// the route minimap and fit show the route shape instead of a single jump (like _hopViaRooms in Studio).
const _viaCache = new Map();
function hopViaRooms(hop) {
  const key = hop.name + '|' + hop.from + '>' + hop.to;
  if (!_viaCache.has(key)) _viaCache.set(key, _computeHopVia(hop));
  return _viaCache.get(key);
}
function _computeHopVia(hop) {
  if (!/woz|dylizans|powoz/.test((hop.board || []).join(' '))) return null;
  const doc = transportsFor();
  const line = (doc?.lines || []).find(l => l.name === hop.name);
  if (!line) return null;
  const chain = [hop.from];
  let cur = hop.from, guard = 0;
  while (cur !== hop.to && guard++ <= line.legs.length) {
    const leg = line.legs.find(l => l.from === cur);
    if (!leg) return null;
    cur = leg.to; chain.push(cur);
  }
  if (cur !== hop.to) return null;
  // walking route between consecutive stops — the wagon's physical road,
  // independent of planner filters (all dirs, no transports)
  let full = [];
  for (let k = 0; k + 1 < chain.length; k++) {
    const seg = A.findRoute(chain[k], chain[k + 1], roomIdx, { algorithm: 'dijkstra', dirMode: 'all', transportMode: 'off' });
    if (!seg.path) return null;
    full = full.length ? full.concat(seg.path.slice(1)) : seg.path.slice();
  }
  return full;
}

function recomputeRoute() {
  const wps = effectiveWps();
  routeLegs = []; planComplete = true; planTotal = 0;
  if (wps.length >= 2) {
    const plan = A.planRoute(wps, roomIdx, {
      algorithm: optAlgoEl.value, dirMode: optDirEl.value,
      transportMode: optTransEl.value, transports: transportsFor() });
    routeLegs = plan.legs; planComplete = plan.complete; planTotal = plan.totalSteps;
  }
  ovGeom = computeOvGeom();
  updateChips();
  updateRouteCode();
  routeStatus();
}

function routeStatus() {
  const wps = effectiveWps();
  if (wps.length < 2) { setStatus(loadedMsg, loadedCls); return; }
  if (!planComplete) {
    if (wps.length === 2) setStatus('no route between the selected rooms', 'warn');
    else {
      const fi = routeLegs.findIndex(l => !l || !l.path);
      setStatus(`no route for leg ${fi + 1} → ${fi + 2} of the waypoints`, 'warn');
    }
    return;
  }
  if (planTotal === 0) { setStatus('start = end — already there', 'ok'); return; }
  const hops = [];
  for (const l of routeLegs) if (l?.hops) for (const h of l.hops) if (h) hops.push(h.name);
  const hopTxt = hops.length ? `, incl. ${hops.length} transport hop(s): ${[...new Set(hops)].join(', ')}` : '';
  const viaTxt = wps.length > 2 ? ` via ${wps.length} waypoints` : '';
  setStatus(`route: ${planTotal} step(s)${viaTxt}${hopTxt}`, 'ok');
}

  const code = wps.length >= 2
    ? A.encodeRoute(wps, { algorithm: optAlgoEl.value, dirMode: optDirEl.value, transportMode: optTransEl.value })
    : '';

}
codeEl.addEventListener('keydown', (e) => {

  if (!res) { setStatus('invalid route code — expected arkmap:<flags>:<ids>:<crc>', 'err'); return; }
  if (res.error === 'crc') { setStatus(`route code corrupted — crc mismatch (expected ${res.expected}, got ${res.actual})`, 'err'); return; }
  if (res.error === 'too-many') { setStatus(`route code has ${res.total} waypoints — max ${res.max}`, 'err'); return; }
  if (res.valid.length < 2) { setStatus('route code: fewer than 2 waypoints exist in this map', 'err'); return; }
  optAlgoEl.value = res.algorithm; optDirEl.value = res.dirMode; optTransEl.value = res.transportMode;
  routeStart = res.valid[0];
  routeEnd = res.valid[res.valid.length - 1];
  routeVias = res.valid.slice(1, -1);

  else setStatus(`route imported: ${res.valid.length} waypoints`, 'ok');

// --- export SVG (true vector) / PNG (2x raster) of the current range with the route ---
function currentExportSvg() {

  const wps = effectiveWps();
  const markers = wps.map((id, i) => ({ id, color: i === 0 ? '#60a5fa' : (i === wps.length - 1 ? '#f87171' : WP_COLORS[i % WP_COLORS.length]), label: String(i + 1) }));
  if (highlightRoom != null) markers.push({ id: highlightRoom, color: '#fb923c' });
  return A.renderSvg(map, { areaId: scope.areaId, z: scope.z, routes, markers, mapLabels: true });
}
function downloadBlob(name, blob) {
  if (typeof URL === 'undefined' || typeof URL.createObjectURL !== 'function') { setStatus('download unavailable in this environment', 'warn'); return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  if (typeof a.click === 'function') a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  return true;
}
// save with the native "Save as" dialog (name to type in, extension from types);
// without the File System Access API (Firefox/Safari) or on API error — classic download
async function saveBlob(name, mime, ext, blob) {
  if (typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function') {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: name, accept: { [mime]: [ext] } }] });
      const w = await handle.createWritable();
      await w.write(blob);
      await w.close();
      return 'saved';
    } catch (e) {
      if (e && e.name === 'AbortError') return 'cancelled';
    }
  }
  return downloadBlob(name, blob) ? 'downloaded' : 'failed';
}
document.getElementById('expSvg').onclick = async () => {

  const r = await saveBlob('map.svg', 'image/svg+xml', '.svg', new Blob([svg], { type: 'image/svg+xml' }));
  if (r === 'saved') setStatus('SVG saved — current area/level with route overlay', 'ok');

// zoom kolkiem — do punktu pod kursorem (swiat pod kursorem zostaje w miejscu,
// mapa nie "ucieka"); clamps zgodne z fit (0.05..60)
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const W = cv.width / devicePixelRatio, H = cv.height / devicePixelRatio;
  const mx = e.clientX - rect.left - W / 2, my = e.clientY - rect.top - H / 2;
  const k = e.deltaY < 0 ? 1.15 : 0.87;
  const ns = Math.max(0.05, Math.min(60, view.scale * k));
  const r = ns / view.scale;
  view.x = mx - (mx - view.x) * r;
  view.y = my - (my - view.y) * r;
  view.scale = ns;
  draw();
}, { passive: false });

// --- geographic minimap (bottom right corner): real coordinates of rooms in the
// current range (area+Z), offscreen cache invalidated on range/map change ---
function drawMinimap() {
  if (!map) { mmEl.hidden = true; return; }
  mmEl.hidden = false;
  const W = 180, H = 120, dpr = devicePixelRatio || 1;
  if (mmEl.width !== Math.round(W * dpr)) { mmEl.width = Math.round(W * dpr); mmEl.height = Math.round(H * dpr); mmDirty = true; }
  const mctx = mmEl.getContext('2d');
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (mmDirty) {
    mmDirty = false;
    if (!mmCache) mmCache = document.createElement('canvas');
    mmCache.width = mmEl.width; mmCache.height = mmEl.height;
    const cctx = mmCache.getContext('2d');
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cctx.fillStyle = '#0d0f12'; cctx.fillRect(0, 0, W, H);
    const pts = roomsInScope();
    if (pts.length) {
      const xs = pts.map(r => r.x), ys = pts.map(r => -r.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const sc = Math.min((W - 8) / Math.max(maxX - minX, 1), (H - 8) / Math.max(maxY - minY, 1));
      const ox = (W - (maxX - minX) * sc) / 2 - minX * sc;
      const oy = (H - (maxY - minY) * sc) / 2 - minY * sc;
      mmXf = { sc, ox, oy };
      for (const r of pts) {
        cctx.fillStyle = envColor(r.env, map.colors);
        cctx.fillRect(ox + r.x * sc - 1, oy + (-r.y) * sc - 1, 2.5, 2.5);
      }
    } else mmXf = null;
  }
  mctx.clearRect(0, 0, W, H);
  if (mmCache) mctx.drawImage(mmCache, 0, 0, W, H);
  if (!mmXf) return;
  const { sc, ox, oy } = mmXf;
  // main-map viewport rectangle (in -room.y space)
  const cw = cv.width / dpr, ch = cv.height / dpr;
  const wx0 = (-cw / 2 - view.x) / view.scale, wx1 = (cw / 2 - view.x) / view.scale;
  const ny0 = (-ch / 2 - view.y) / view.scale, ny1 = (ch / 2 - view.y) / view.scale;
  mctx.strokeStyle = 'rgba(255,255,255,0.75)'; mctx.lineWidth = 1;
  mctx.strokeRect(ox + wx0 * sc, oy + ny0 * sc, (wx1 - wx0) * sc, (ny1 - ny0) * sc);
  // markers: start (blue), end (red), inspection (orange)
  const dot = (id, col) => {
    const e = roomIdx.get(id);
    if (!e || !visible(e.room, e.areaId)) return;
    mctx.fillStyle = col;
    mctx.fillRect(ox + e.room.x * sc - 2, oy + (-e.room.y) * sc - 2, 4, 4);
  };
  if (routeStart != null) dot(routeStart, '#60a5fa');
  if (routeEnd != null) dot(routeEnd, '#f87171');
  if (highlightRoom != null) dot(highlightRoom, '#fb923c');
}

// pan the main map by click/drag on the minimap (guard: pointerup/leave ends the drag)
mmEl.addEventListener('pointerdown', e => {
  if (!mmXf) return;
  mmDrag = true;
  mmEl.setPointerCapture?.(e.pointerId);
  mmPan(e);
});
mmEl.addEventListener('pointermove', e => { if (mmDrag) mmPan(e); });
mmEl.addEventListener('pointerup', () => { mmDrag = false; });
mmEl.addEventListener('pointerleave', () => { mmDrag = false; });
function mmPan(e) {
  if (!mmXf) return;
  const rect = mmEl.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const wx = (mx - mmXf.ox) / mmXf.sc, ny = (my - mmXf.oy) / mmXf.sc;   // ny = -room.y
  view.x = -wx * view.scale;
  view.y = -ny * view.scale;
  draw();
}

// --- schematic route preview (bottom left corner): polyline from step deltas (clamp ±1),
// NOT real coordinates (teleports/hops do not break the shape). Hops dashed,
// land rides broken down into road rooms, numbered WP markers, green
// "you are here" overlay = segments visible in the main map viewport (like #wp-overview in Studio).
function computeOvGeom() {
  const wps = effectiveWps();
  if (wps.length < 2 || !routeLegs.length) return null;
  const pts = [[0, 0]], segHop = [], ptRoom = [null], wpMarkers = [];
  let cx = 0, cy = 0;
  for (let li = 0; li < routeLegs.length; li++) {
    wpMarkers.push({ ptIdx: pts.length - 1, wpIdx: li });
    const leg = routeLegs[li];
    if (!leg || !leg.path || leg.path.length < 2) continue;
    for (let i = 0; i + 1 < leg.path.length; i++) {
      const hop = leg.hops?.[i] || null;
      const via = hop ? hopViaRooms(hop) : null;
      const steps = via || [leg.path[i], leg.path[i + 1]];
      for (let k = 0; k + 1 < steps.length; k++) {
        const sa = roomIdx.get(steps[k])?.room, sb = roomIdx.get(steps[k + 1])?.room;
        if (!sa || !sb) continue;
        cx += Math.max(-1, Math.min(1, sb.x - sa.x));
        cy -= Math.max(-1, Math.min(1, sb.y - sa.y));
        pts.push([cx, cy]); segHop.push(!!hop); ptRoom.push(steps[k + 1]);
      }
    }
  }
  wpMarkers.push({ ptIdx: pts.length - 1, wpIdx: routeLegs.length });
  return pts.length > 1 ? { pts, segHop, ptRoom, wpMarkers } : null;
}

function drawRouteOv() {
  const show = !!map && effectiveWps().length >= 2 && !!ovGeom;
  ovEl.hidden = !show;
  if (!show) return;
  const W = 200, H = 140, dpr = devicePixelRatio || 1;
  if (ovc.width !== Math.round(W * dpr)) { ovc.width = Math.round(W * dpr); ovc.height = Math.round(H * dpr); }
  const g = ovc.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#0d0f12'; g.fillRect(0, 0, W, H);
  const { pts, segHop, ptRoom, wpMarkers } = ovGeom;
  const PAD = 14;   // room for the WP markers
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [px, py] of pts) {
    if (px < minX) minX = px; if (px > maxX) maxX = px;
    if (py < minY) minY = py; if (py > maxY) maxY = py;
  }
  const spanX = Math.max(maxX - minX, 1), spanY = Math.max(maxY - minY, 1);
  const sc = Math.min((W - PAD * 2) / spanX, (H - PAD * 2) / spanY);
  const ox = (W - spanX * sc) / 2 - minX * sc;
  const oy = (H - spanY * sc) / 2 - minY * sc;
  const toC = ([px, py]) => [ox + px * sc, oy + py * sc];
  const ovSeg = hop => g.setLineDash(hop ? [2, 2.5] : []);
  const strokePass = (width, style, filter) => {
    g.lineWidth = width; g.strokeStyle = style;
    for (let i = 1; i < pts.length; i++) {
      if (filter && !filter(i)) continue;
      ovSeg(segHop[i - 1]);
      const [ax, ay] = toC(pts[i - 1]);
      const [px, py] = toC(pts[i]);
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(px, py); g.stroke();
    }
    g.setLineDash([]);
  };
  g.lineCap = 'round'; g.lineJoin = 'round';
  strokePass(3, 'rgba(232,160,32,0.12)');              // glow
  strokePass(1.5, 'rgba(255,190,50,0.9)');             // linia glowna
  // "you are here": segments whose target room is on screen (current area+Z)
  const cw = cv.width / dpr, ch = cv.height / dpr;
  const wx0 = (-cw / 2 - view.x) / view.scale, wx1 = (cw / 2 - view.x) / view.scale;
  const ny0 = (-ch / 2 - view.y) / view.scale, ny1 = (ch / 2 - view.y) / view.scale;
  const onScreen = i => {
    const e = ptRoom[i] != null ? roomIdx.get(ptRoom[i]) : null;
    if (!e || !visible(e.room, e.areaId)) return false;
    const ny = -e.room.y;
    return e.room.x >= wx0 && e.room.x <= wx1 && ny >= ny0 && ny <= ny1;
  };
  strokePass(3, 'rgba(0,200,150,0.28)', onScreen);
  strokePass(1.5, 'rgba(0,230,170,0.95)', onScreen);
  // WP markers — colored squares with numbers (WP_COLORS cycle)
  const SZ = 5;
  for (const { ptIdx, wpIdx } of wpMarkers) {
    const [px, py] = toC(pts[ptIdx]);
    const col = WP_COLORS[wpIdx % WP_COLORS.length];
    g.fillStyle = 'rgba(0,0,0,0.7)';
    g.fillRect(px - SZ - 1, py - SZ - 1, (SZ + 1) * 2, (SZ + 1) * 2);
    g.fillStyle = col;
    g.fillRect(px - SZ, py - SZ, SZ * 2, SZ * 2);
    g.fillStyle = '#000';
    g.font = `bold ${Math.round(SZ * 1.5)}px monospace`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(wpIdx + 1), px, py);
  }
}

function afterLoad(msg, cls) {
  scope.z = null;   // nowa mapa -> populateSelectors wybierze domyslny (najludniejszy) poziom
  roomIdx = A.buildIndex(map);
  colorCache = A.RENDER_MODEL.buildColorCache(map);
  modelById = new Map(); modelAreaOf = new Map(); mapSeq++;
  for (const area of map?.areas || []) for (const room of area.rooms || []) {
    modelById.set(room.id, room); modelAreaOf.set(room.id, area.id);
  }
  routeStart = routeEnd = highlightRoom = null;
  routeVias = []; routeLegs = []; planComplete = true; planTotal = 0;
  startEl.value = endEl.value = codeEl.value = '';
  optAlgoEl.value = 'dijkstra'; optDirEl.value = 'all'; optTransEl.value = 'off';
  disarm();
  routeRes.style.display = 'none';
  closeRoomPanel();
  ovGeom = null;
  mmDirty = true;
  _viaCache.clear();
  labelImgCache.clear();
  _lastCrossArrows = [];
  loadedMsg = msg; loadedCls = cls;
  emptyEl.style.display = 'none';
  setStatus(msg, cls);
  populateSelectors();
  document.getElementById('expSvg').hidden = false;
  document.getElementById('expPng').hidden = false;
  document.getElementById('searchBox').hidden = false;
  routeBox.hidden = false;
  zoomBar.hidden = false;
  updateChips();
  resize();   // the header reflows on (un)hide — the canvas needs fresh dimensions before fit
  fit(); draw();
}

// ===CHECKSUM-STATUS-BEGIN===
// Detailed integrity status: what is broken and where (room/area/meta/alg).
// verifyChecksums field semantics: badRooms/badAreas = content changed; missing* = object
// in the file WITHOUT a checksum (added); extra* = orphan checksum (object removed); metaOk outside ok (D2).
function checksumStatus(fileName, rooms, cs) {
  if (!cs.present) return [`${fileName} — ${rooms} rooms — no checksums in file`, 'warn'];
  if (cs.algMismatch) return [`${fileName} — checksum algorithm mismatch: file has '${cs.algMismatch}', this viewer supports 'v4' (possible downgrade attempt)`, 'err'];
  if (cs.verifyError) return [`${fileName} — checksum verification failed: corrupt data (see validation)`, 'err'];
  const probs = [];
  if (cs.badRooms?.length) probs.push(`${cs.badRooms.length} room(s) modified (first: room #${cs.badRooms[0].roomId} in area "${cs.badRooms[0].areaName}")`);
  if (cs.badAreas?.length) probs.push(`${cs.badAreas.length} area(s) modified (first: #${cs.badAreas[0].id} "${cs.badAreas[0].name}")`);
  if (cs.missingRooms?.length) probs.push(`${cs.missingRooms.length} room(s) without checksum (added, unsigned)`);
  if (cs.extraRooms?.length) probs.push(`${cs.extraRooms.length} orphaned room checksum(s) (rooms removed)`);
  if (cs.missingAreas?.length) probs.push(`${cs.missingAreas.length} area(s) without checksum (added, unsigned)`);
  if (cs.extraAreas?.length) probs.push(`${cs.extraAreas.length} orphaned area checksum(s) (areas removed)`);
  if (cs.fileOk === false && !probs.length) probs.push('whole-file hash mismatch');
  if (!cs.ok) return [`${fileName} — ${rooms} rooms — CHECKSUM MISMATCH: ${probs.join('; ')}`, 'err'];
  if (cs.metaOk === false) return [`${fileName} — ${rooms} rooms — data checksums OK, but META checksum mismatch (map metadata modified)`, 'warn'];
  return [`${fileName} — ${rooms} rooms — checksums OK [v4]`, 'ok'];
}
// ===CHECKSUM-STATUS-END===

// ===TRANSPORT-STATUS-BEGIN===
// Separate status of the transport layer (embedded lines have their own v4 checksums,
// computed independently of the room checksums). Transport is an add-on — a problem lowers the status to warn,
// never err (a walking route always exists as a fallback).
function transportStatus(m) {
  const ts = A.verifyTransportChecksums(m);
  if (!ts.present && !ts.unsigned) return null;                        // no transports at all
  if (!ts.present) return { suffix: ` — transports: ${ts.lineCount} line(s), unsigned`, level: 'warn' };
  if (ts.verifyError) return { suffix: ' — transport checksum verification failed', level: 'warn' };
  if (ts.ok) return { suffix: ` — transports OK [${Object.keys(m.checksums.transports.lines).length} line(s)]`, level: 'ok' };
  const probs = [];
  if (ts.badLines?.length) probs.push(`${ts.badLines.length} line(s) modified (first: "${ts.badLines[0]}")`);
  if (ts.missingLines?.length) probs.push(`${ts.missingLines.length} line(s) unsigned (first: "${ts.missingLines[0]}")`);
  if (ts.extraLines?.length) probs.push(`${ts.extraLines.length} orphaned transport checksum(s) (lines removed)`);
  return { suffix: ` — TRANSPORT CHECKSUM MISMATCH: ${probs.join('; ')}`, level: 'warn' };
}
// ===TRANSPORT-STATUS-END===

function loadArkmapText(fileName, text) {
  const { map: m, validation, checksums } = A.loadArkmap(text);
  map = m;
  const rooms = (m.areas || []).reduce((s, a) => s + (a.rooms || []).length, 0);
  if (!validation.ok) afterLoad(`${fileName} — ${validation.errors.length} validation error(s), first: ${validation.errors[0].path} ${validation.errors[0].msg}`, 'err');
  else {
    const [msg, cls] = checksumStatus(fileName, rooms, checksums);
    const ts = transportStatus(m);
    // transports can only lower 'ok' -> 'warn'; other statuses pass through unchanged
    afterLoad(ts ? msg + ts.suffix : msg, ts && cls === 'ok' ? ts.level : cls);
  }
}

function loadDatBuffer(fileName, buf) {
  map = A.datToArkmap(buf);
  const rooms = (map.areas || []).reduce((s, a) => s + (a.rooms || []).length, 0);
  afterLoad(`${fileName} — ${rooms} rooms — .dat converted by arkmap-js`, 'ok');
}

// local file: FileReader with progress events (uniform for .dat and .arkmap)
function loadFile(file) {
  const isArkmap = /\.arkmap$/i.test(file.name);
  progStart(`loading ${file.name} — 0%`);
  const reader = new FileReader();
  reader.onprogress = e => { if (e.lengthComputable) progSet(e.loaded / e.total, `loading ${file.name} — ${Math.round(e.loaded / e.total * 100)}%`); };
  reader.onerror = () => { progDone(); setStatus('read error', 'err'); };
  reader.onload = () => {
    progParsing(`parsing ${file.name}…`);
    setTimeout(() => {   // let the overlay paint before the heavy parse
      try { isArkmap ? loadArkmapText(file.name, reader.result) : loadDatBuffer(file.name, reader.result); }
      catch (e) { setStatus(`${file.name} — ${e.message}`, 'err'); }
      progDone();
    }, 30);
  };
  isArkmap ? reader.readAsText(file) : reader.readAsArrayBuffer(file);
}

document.getElementById('open').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };
const dropEl = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('on'); });
addEventListener('dragleave', e => { if (e.relatedTarget === null) dropEl.classList.remove('on'); });
addEventListener('drop', e => { e.preventDefault(); dropEl.classList.remove('on'); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

// optional: load a map by URL — ?src=https://…/map.arkmap (or .dat), with byte progress when the server sends Content-Length
const srcParam = new URLSearchParams(location.search).get('src');
if (srcParam) {
  (async () => {
    const name = srcParam.split('/').pop() || 'remote map';
    const isArkmap = /\.arkmap($|\?)/i.test(srcParam);
    try {
      progStart(`fetching ${name}…`);
      const r = await fetch(srcParam);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const total = +r.headers.get('Content-Length') || 0;
      let data;
      if (r.body && total) {
        const rd = r.body.getReader();
        const chunks = []; let got = 0;
        for (;;) {
          const { done, value } = await rd.read();
          if (done) break;
          chunks.push(value); got += value.length;
          progSet(got / total, `fetching ${name} — ${Math.round(got / total * 100)}%`);
        }
        const all = new Uint8Array(got);
        let off = 0; for (const c of chunks) { all.set(c, off); off += c.length; }
        data = all;
      } else {
        data = new Uint8Array(await r.arrayBuffer());
      }
      progParsing(`parsing ${name}…`);
      await new Promise(res => setTimeout(res, 30));
      if (isArkmap) loadArkmapText(name, new TextDecoder().decode(data));
      else loadDatBuffer(name, data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
    } catch (e) {
      setStatus('fetch failed — ' + e.message, 'err');
    } finally {
      progDone();
    }
  })();
}

resize();
</script>
